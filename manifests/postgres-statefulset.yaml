apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: taskapp

spec:
  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
      - name: postgres

        image: postgres:15

        ports:
        - containerPort: 5432

        env:

        - name: POSTGRES_DB
          value: taskapp

        - name: POSTGRES_USER
          value: taskapp

        - name: POSTGRES_PASSWORD
          value: taskapp123

        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:

  - metadata:
      name: postgres-storage

    spec:
      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: 5Gi