apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: taskapp
  namespace: taskapp

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - helloisthisjojo.shop
      secretName: taskapp-tls

  rules:
    - host: helloisthisjojo.shop

      http:

        paths:

        - path: /

          pathType: Prefix

          backend:

            service:

              name: frontend

              port:

                number: 80

        - path: /api

          pathType: Prefix

          backend:

            service:

              name: backend

              port:

                number: 5000